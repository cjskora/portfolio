    <script>
      // Apply the saved theme before first paint to avoid a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();

      // Restore the deep link that 404.html encoded (GitHub Pages SPA fallback).
      (function () {
        var redirect = new URLSearchParams(window.location.search).get('p');
        if (redirect) {
          history.replaceState(null, '', redirect + window.location.hash);
        }
      })();
    </script>
