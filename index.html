<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Christopher Skora | Nanotechnology Engineering Student</title>
    <meta
      name="description"
      content="Portfolio of Christopher Skora, a University of Waterloo Nanotechnology Engineering student working on radiation detector systems, coincidence spectroscopy, and Python data-analysis pipelines at SNOLAB."
    />
    <meta name="author" content="Christopher Skora" />
    <meta
      name="keywords"
      content="Christopher Skora, Nanotechnology Engineering, University of Waterloo, SNOLAB, SiPM, HPGe, coincidence detector, RAMPS, SNO+, physics data analysis"
    />
    <link rel="canonical" href="https://cjskora.github.io/portfolio/" />
    <meta name="robots" content="index, follow" />
    <meta
      name="theme-color"
      content="#090D14"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#F6F8FB"
      media="(prefers-color-scheme: light)"
    />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Christopher Skora" />
    <meta
      property="og:title"
      content="Christopher Skora | Nanotechnology Engineering Student"
    />
    <meta
      property="og:description"
      content="Radiation detector systems, coincidence spectroscopy, and Python analysis pipelines. Research projects and resume."
    />
    <meta property="og:url" content="https://cjskora.github.io/portfolio/" />
    <meta
      property="og:image"
      content="https://cjskora.github.io/portfolio/images/og-image.jpg"
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Christopher Skora | Nanotechnology Engineering Student"
    />
    <meta
      name="twitter:description"
      content="Radiation detector systems, coincidence spectroscopy, and Python analysis pipelines."
    />
    <meta
      name="twitter:image"
      content="https://cjskora.github.io/portfolio/images/og-image.jpg"
    />

    <!-- Structured data so Google can build a knowledge panel entry -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Christopher Skora",
        "jobTitle": "Nanotechnology Engineering Student",
        "url": "https://cjskora.github.io/portfolio/",
        "email": "mailto:cjskora@gmail.com",
        "image": "https://cjskora.github.io/portfolio/images/headshot.jpg",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Waterloo"
        },
        "worksFor": {
          "@type": "Organization",
          "name": "SNOLAB"
        },
        "knowsAbout": [
          "Radiation detection",
          "Coincidence spectroscopy",
          "Silicon photomultipliers",
          "High-purity germanium detectors",
          "Python data analysis"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/cjskora/",
          "https://github.com/cjskora"
        ]
      }
    </script>

    <script>
      // Dark is the default. The class is already on <html> so there is no
      // flash; we only strip it when the visitor has explicitly chosen light.
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();

      // Restore the deep link that 404.html encoded (GitHub Pages SPA fallback).
      (function () {
        var redirect = new URLSearchParams(window.location.search).get("p");
        if (redirect) {
          history.replaceState(null, "", redirect + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
